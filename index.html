  function cellTitle(h, cell) {
    var d = E.humanDate(cell.day);
    if (cell.future) return d + ' — not yet';
    if (!cell.scheduled) return d + ' — not scheduled';
    var v = E.getValue(store.entries, h.id, cell.day);
    if (h.type === 'simple') return d + (v ? ' — done' : ' — missed');
    if (h.type === 'goal') return d + ' — ' + v + '/' + h.target + ' ' + h.unit + (v >= h.target ? ' ✓' : '');
    return d + ' — ' + v + ' ' + h.unit + (v > 0 ? ' ✓' : ' — missed');
  }

  function heatmapBlock(h, weeks, cls) {
    var map = E.heatmap([h], store.entries, {
      end: today(), weeks: weeks, weekStart: store.settings.weekStart, habit: h, today: today()
    });

    var monthRow = el('div', { class: 'heat-months' });
    var lastMonth = -1;
    map.weeks.forEach(function (col) {
      var d = E.keyToDate(col[0].day);
      var label = '';
      if (d.getMonth() !== lastMonth) { label = MONTHS_SHORT[d.getMonth()]; lastMonth = d.getMonth(); }
      monthRow.appendChild(el('span', { text: label }));
    });

    var dayCol = el('div', { class: 'heat-days' });
    var ws = store.settings.weekStart;
    for (var i = 0; i < 7; i++) {
      var wd = (ws + i) % 7;
      var show = wd === 1 || wd === 3 || wd === 5;
      dayCol.appendChild(el('span', { text: show ? WEEK_LABELS[wd] : '' }));
    }

    var grid = el('div', { class: 'heat-grid' });
    map.weeks.forEach(function (col) {
      var colEl = el('div', { class: 'heat-col' });
      col.forEach(function (cell) {
        var classes = ['heat-cell'];
        if (cell.level === -1) classes.push('is-empty');
        else classes.push('is-l' + cell.level);
        if (cell.future) classes.push('is-future');
        if (cell.day === today()) classes.push('is-today');
        colEl.appendChild(el('button', {
          class: classes.join(' '),
          type: 'button',
          title: cellTitle(h, cell),
          'aria-label': cellTitle(h, cell),
          'data-day': cell.day,
          'data-habit': h.id,
          'data-heat': '1'
        }));
      });
      grid.appendChild(colEl);
    });

    var legend = el('div', { class: 'legend' }, [
      el('span', { text: 'Less' }),
      el('i', { class: 'heat-cell is-l0' }), el('i', { class: 'heat-cell is-l1' }),
      el('i', { class: 'heat-cell is-l2' }), el('i', { class: 'heat-cell is-l3' }),
      el('i', { class: 'heat-cell is-l4' }),
      el('span', { text: 'More' })
    ]);

    var st = E.stats(h, store.entries, today());

    return el('div', { class: 'heat ' + (cls || ''), style: '--hc:' + h.color }, [
      monthRow,
      el('div', { class: 'heat-body' }, [dayCol, grid]),
      el('div', { class: 'heat-foot' }, [
        legend,
        el('span', { class: 'tiny dim', text: (st.current > 0 ? '🔥 ' + st.current + ' day streak · ' : '') + (st.rate === null ? 'no history yet' : Math.round(st.rate * 100) + '% success') })
      ])
    ]);
  }

  function habitCard(h) {
    var v = E.getValue(store.entries, h.id, today());
    var done = E.isComplete(h, store.entries, today());
    var st = E.stats(h, store.entries, today());
    var isGoal = h.type === 'goal';
    var pct = Math.round(E.progressOf(h, store.entries, today()) * 100);

    var card = el('article', {
      class: 'habit' + (done ? ' is-done' : '') + (h.archived ? ' is-archived' : ''),
      style: '--hc:' + h.color,
      'data-habit': h.id
    });

    /* --- header ------------------------------------------------------- */
    var streakPill = el('span', { class: 'streak-pill' + (st.current ? '' : ' is-cold') }, [
      el('span', { html: icon('flame', 13), style: 'display:flex;opacity:' + (st.current ? 1 : .5) }),
      el('span', { text: st.current ? String(st.current) : '—' })
    ]);
    if (st.current) streakPill.title = st.current + ' ' + (h.schedule === 'daily' ? 'day' : 'session') + ' streak · best ' + st.best;

    var meta = el('div', { class: 'habit-meta' }, [
      streakPill,
      el('span', { class: 'dot' }),
      el('span', { text: typeText(h) }),
      h.category ? el('span', { class: 'dot' }) : null,
      h.category ? el('span', { text: h.category }) : null,
      h.schedule !== 'daily' ? el('span', { class: 'dot' }) : null,
      h.schedule !== 'daily' ? el('span', { text: scheduleText(h) }) : null
    ]);

    var checkInner = [
      el('span', {
        html: '<svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" ' +
              'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS.check + '</svg>'
      })
    ];
    if (h.type === 'count' && v > 0) checkInner.push(el('span', { class: 'check-badge', text: String(v) }));

    var check = el('button', {
      class: 'check' + (done ? ' is-done' : ''),
      type: 'button',
      'data-bump': h.id,
      'aria-pressed': done ? 'true' : 'false',
      'aria-label': (done ? 'Undo ' : 'Complete ') + h.name + ' for today',
      title: done ? 'Tap to undo' : 'Tap to complete',
      html: null
    }, checkInner);

    card.appendChild(el('div', { class: 'habit-head' }, [
      el('div', { class: 'habit-emoji', text: h.emoji, 'aria-hidden': 'true' }),
      el('div', { class: 'grow' }, [
        el('div', { class: 'row-between' }, [
          el('h3', { class: 'habit-title truncate', text: h.name }),
          h.type !== 'simple' && !done ? el('span', { class: 'tiny dim num', text: progressText(h, v) }) : null
        ]),
        meta
      ]),
      check
    ]));

    /* --- progress + quick actions ------------------------------------- */
    if (h.type !== 'simple') {
      card.appendChild(el('div', { class: 'bar', role: 'progressbar', 'aria-valuenow': pct, 'aria-valuemin': '0', 'aria-valuemax': '100', 'aria-label': h.name + ' progress' }, [
        el('div', { class: 'bar-fill', style: 'width:' + pct + '%' })
      ]));
    }

    var actions = el('div', { class: 'habit-actions' }, [
      h.type !== 'simple' ? el('button', {
        class: 'btn btn-sm', type: 'button', 'data-bump': h.id,
        html: icon('plus', 14) + '<span>Log one</span>'
      }) : null,
      h.type !== 'simple' && v > 0 ? el('button', {
        class: 'btn btn-sm btn-ghost', type: 'button', 'data-undo': h.id, title: 'Remove the last entry',
        html: icon('minus', 14) + '<span>Undo</span>'
      }) : null,
      el('span', { class: 'grow' }),
      el('button', {
        class: 'icon-btn', type: 'button', 'data-edit': h.id, title: 'Edit habit', 'aria-label': 'Edit ' + h.name,
        html: icon('pencil', 16)
      }),
      el('button', {
        class: 'icon-btn', type: 'button', 'data-toggle-heat': h.id, title: 'Show calendar heatmap',
        'aria-label': 'Toggle heatmap for ' + h.name, 'aria-expanded': ui.openHeat[h.id] ? 'true' : 'false',
        html: icon('grid', 16)
      }),
      el('button', {
        class: 'icon-btn is-danger', type: 'button', 'data-del': h.id, title: 'Delete habit',
        'aria-label': 'Delete ' + h.name, html: icon('trash', 16)
      })
    ]);
    card.appendChild(actions);

    /* --- heatmap ------------------------------------------------------- */
    if (ui.openHeat[h.id]) {
      card.appendChild(heatmapBlock(h, ui.heatWeeks));
    } else {
      card.appendChild(el('div', { class: 'heat', style: '--hc:' + h.color }, [
        heatmapBlock(h, 8, 'heat-mini')
      ]));
    }

    return card;
  }

  /* ============================================================ today view = */

  function renderToday() {
    var host = $('#view-today');
    clear(host);

    var active = habits();
    var o = E.overall(active, store.entries, today());
    var now = E.keyToDate(today());

    /* headline */
    host.appendChild(el('div', { class: 'page-head' }, [
      el('div', {}, [
        el('h1', { class: 'page-title', text: now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }) }),
        el('p', { class: 'page-sub', text: active.length
          ? (o.todayScheduled === 0 ? 'Nothing scheduled today.' : o.todayDone + ' of ' + o.todayScheduled + ' done today.')
          : 'Add your first habit to get started.' })
      ]),
      el('div', { class: 'row' }, [
        el('button', {
          class: 'btn btn-primary', type: 'button', 'data-new': '1',
          html: icon('plus', 17) + '<span>New habit</span>'
        })
      ])
    ]));

    /* stat tiles */
    var tiles = el('div', { class: 'stats' });
    function tile(label, value, foot, extra) {
      tiles.appendChild(el('div', { class: 'stat' }, [
        el('div', { class: 'stat-label', text: label }),
        el('div', { class: 'stat-value' }, [
          el('span', { text: value }),
          extra ? el('small', { text: extra }) : null
        ]),
        el('div', { class: 'stat-foot', text: foot })
      ]));
    }

    tile('Today', o.todayScheduled ? o.todayDone + '/' + o.todayScheduled : '0',
      o.todayScheduled ? Math.round((o.todayRate || 0) * 100) + '% complete' : 'No habits due');
    tile('Perfect-day streak', String(o.perfectStreak),
      o.perfectStreak === 1 ? 'day with everything done' : 'days with everything done');
    tile('Longest streak', String(o.best),
      o.bestHabit ? 'on ' + o.bestHabit : 'no streak yet');
    tile('Last 30 days', o.avg30 === null ? '—' : Math.round(o.avg30 * 100) + '%',
      o.totalChecks + ' check-ins all time');
    host.appendChild(tiles);

    /* toolbar */
    var cats = categories();
    var toolbar = el('div', { class: 'toolbar' }, [
      el('label', { class: 'search' }, [
        el('span', { html: icon('target', 16), style: 'display:flex' }),
        el('input', {
          type: 'search', placeholder: 'Search habits…', value: ui.query,
          'aria-label': 'Search habits', oninput: function () { ui.query = this.value; renderList(); }
        })
      ]),
      cats.length > 1 ? el('select', {
        class: 'control', 'aria-label': 'Filter by category', onchange: function () { ui.habitFilter = this.value; renderList(); }
      }, [el('option', { value: 'all', text: 'All categories' })].concat(cats.map(function (c) {
        return el('option', { value: c, text: c, selected: ui.habitFilter === c });
      }))) : null,
      el('span', { class: 'grow' }),
      el('div', { class: 'seg', role: 'group', 'aria-label': 'Heatmap length' }, [
        segBtn('8 weeks', ui.heatWeeks === 8, function () { ui.heatWeeks = 8; renderList(); }),
        segBtn('26 weeks', ui.heatWeeks === 26, function () { ui.heatWeeks = 26; renderList(); }),
        segBtn('1 year', ui.heatWeeks === 53, function () { ui.heatWeeks = 53; renderList(); })
      ])
    ]);
    host.appendChild(toolbar);

    var listHost = el('div', { class: 'habits', id: 'habit-list' });
    host.appendChild(listHost);
    renderList();
  }

  function segBtn(label, on, onclick) {
    return el('button', { class: 'seg-btn', type: 'button', 'aria-pressed': on ? 'true' : 'false', text: label, onclick: onclick });
  }

  function renderList() {
    var host = $('#habit-list');
    if (!host) return;
    clear(host);
    var list = visibleHabits();

    if (!habits().length) {
      host.appendChild(el('div', { class: 'empty' }, [
        el('div', { class: 'empty-mark', html: icon('sparkle', 24), style: 'display:grid' }),
        el('h3', { text: 'No habits yet' }),
        el('p', { text: 'Pick one small thing you want to do every day. One tap to check it off, and your streak starts building.' }),
        el('button', { class: 'btn btn-primary btn-lg', type: 'button', 'data-new': '1', html: icon('plus', 17) + '<span>Create your first habit</span>' })
      ]));
      return;
    }

    if (!list.length) {
      host.appendChild(el('div', { class: 'empty' }, [
        el('div', { class: 'empty-mark', html: icon('target', 24), style: 'display:grid' }),
        el('h3', { text: 'Nothing matches' }),
        el('p', { text: 'Try a different search term or category filter.' })
      ]));
      return;
    }

    list.forEach(function (h) { host.appendChild(habitCard(h)); });
    host.appendChild(el('button', { class: 'btn btn-lg', type: 'button', 'data-new': '1', style: 'grid-column:1/-1', html: icon('plus', 17) + '<span>Add another habit</span>' }));
  }

  /* ========================================================= calendar view = */

  function renderCalendar() {
    var host = $('#view-calendar');
    clear(host);

    var ws = store.settings.weekStart;
    var grid = E.monthGrid(ui.month, ws);
    var active = habits();

    /* header */
    host.appendChild(el('div', { class: 'page-head' }, [
      el('div', {}, [
        el('h1', { class: 'page-title', text: E.monthLabel(ui.month) }),
        el('p', { class: 'page-sub', text: 'Your whole history, day by day. Tap any day to see or edit it.' })
      ]),
      el('div', { class: 'cal-nav' }, [
        el('button', { class: 'btn btn-icon', type: 'button', 'aria-label': 'Previous month', html: icon('chevronLeft', 18), 'data-month': '-1' }),
        el('button', { class: 'btn btn-sm', type: 'button', text: 'Today', 'data-month': 'today' }),
        el('button', { class: 'btn btn-icon', type: 'button', 'aria-label': 'Next month', html: icon('chevronRight', 18), 'data-month': '1' })
      ])
    ]));

    var wrap = el('div', { class: 'cal-wrap' });

    /* month panel */
    var panel = el('div', { class: 'panel' });
    var dow = el('div', { class: 'cal-dow' });
    for (var i = 0; i < 7; i++) dow.appendChild(el('span', { text: WEEK_LABELS[(ws + i) % 7] }));
    panel.appendChild(dow);

    var calGrid = el('div', { class: 'cal-grid' });
    grid.weeks.forEach(function (week) {
      week.forEach(function (cell) {
        calGrid.appendChild(calendarDay(cell, active));
      });
    });
    panel.appendChild(calGrid);

    /* dots legend */
    panel.appendChild(el('div', { class: 'heat-foot' }, [
      el('span', { class: 'tiny dim', text: 'Each dot is one habit · filled = done that day · ring = share of habits completed' })
    ]));

    wrap.appendChild(panel);
    wrap.appendChild(dayPanel(active));
    host.appendChild(wrap);

    /* year overview */
    host.appendChild(el('div', { class: 'section' }, [
      el('div', { class: 'row-between', style: 'margin-bottom:12px' }, [
        el('div', {}, [
          el('div', { class: 'section-title', text: 'Year in review' }),
          el('div', { class: 'section-sub', text: 'Every day you showed up, for the last 12 months.' })
        ]),
        el('select', {
          class: 'control', 'aria-label': 'Habit shown in year overview',
          onchange: function () { ui.yearHabit = this.value; renderCalendar(); }
        }, [el('option', { value: 'all', text: 'All habits', selected: ui.yearHabit === 'all' })].concat(
          habits().map(function (h) {
            return el('option', { value: h.id, text: h.emoji + ' ' + h.name, selected: ui.yearHabit === h.id });
          })))
      ]),
      el('div', { class: 'panel year-heat', style: '--hc:' + yearColor() }, [
        yearHeatBlock()
      ])
    ]));

    host.appendChild(el('div', { class: 'section' }, [
      el('div', { class: 'row-between', style: 'margin-bottom:12px' }, [
        el('div', {}, [
          el('div', { class: 'section-title', text: 'All habits' }),
          el('div', { class: 'section-sub', text: active.length + ' active' })
        ])
      ]),
      el('div', { class: 'habits' }, active.map(function (h) {
        var st = E.stats(h, store.entries, today());
        return el('div', { class: 'panel', style: '--hc:' + h.color }, [
          el('div', { class: 'row-between', style: 'margin-bottom:10px' }, [
            el('div', { class: 'row' }, [
              el('div', { class: 'habit-emoji', text: h.emoji, 'aria-hidden': 'true', style: 'width:32px;height:32px;font-size:16px' }),
              el('div', {}, [
                el('div', { class: 'bold small', text: h.name }),
                el('div', { class: 'tiny dim', text: (st.rate === null ? 'no history' : Math.round(st.rate * 100) + '% success') + ' · best ' + st.best })
              ])
            ]),
            el('span', { class: 'streak-pill' + (st.current ? '' : ' is-cold') }, [
              el('span', { html: icon('flame', 13), style: 'display:flex' }),
              el('span', { text: String(st.current) })
            ])
          ]),
          heatmapBlock(h, 26, 'heat-mini')
        ]);
      }))
    ]));
  }

  function yearColor() {
    if (ui.yearHabit === 'all') return 'var(--text-2)';
    var h = find(ui.yearHabit);
    return h ? h.color : 'var(--text-2)';
  }

  function yearHeatBlock() {
    var habit = ui.yearHabit === 'all' ? null : find(ui.yearHabit);
    var map = E.heatmap(habits(), store.entries, {
      end: today(), weeks: 53, weekStart: store.settings.weekStart, habit: habit, today: today()
    });

    var monthRow = el('div', { class: 'heat-months' });
    var lastMonth = -1;
    map.weeks.forEach(function (col) {
      var d = E.keyToDate(col[0].day);
      var label = '';
      if (d.getMonth() !== lastMonth && E.keyToDate(col[0].day).getDate() <= 14) {
        label = MONTHS_SHORT[d.getMonth()];
        lastMonth = d.getMonth();
      }
      monthRow.appendChild(el('span', { text: label }));
    });

    var dayCol = el('div', { class: 'heat-days' });
    var ws = store.settings.weekStart;
    for (var i = 0; i < 7; i++) {
      var wd = (ws + i) % 7;
      dayCol.appendChild(el('span', { text: (wd === 1 || wd === 3 || wd === 5) ? WEEK_LABELS[wd] : '' }));
    }

    var grid = el('div', { class: 'heat-grid' });
    map.weeks.forEach(function (col) {
      var colEl = el('div', { class: 'heat-col' });
      col.forEach(function (cell) {
        var classes = ['heat-cell'];
        if (cell.level === -1) classes.push('is-empty');
        else classes.push('is-l' + cell.level);
        if (cell.future) classes.push('is-future');
        if (cell.day === today()) classes.push('is-today');
        var label = E.humanDate(cell.day) + (cell.frac === null ? ' — no habits' : ' — ' + Math.round(cell.frac * 100) + '%');
        colEl.appendChild(el('button', {
          class: classes.join(' '), type: 'button', title: label, 'aria-label': label,
          'data-day': cell.day, 'data-open-day': '1', 'data-heat': '1'
        }));
      });
      grid.appendChild(colEl);
    });

    return el('div', {}, [
      monthRow,
      el('div', { class: 'heat-body' }, [dayCol, grid])
    ]);
  }

  function calendarDay(cell, active) {
    var day = cell.day;
    var sum = E.daySummary(active, store.entries, day);
    var isFuture = E.diffDays(day, today()) > 0;
    var pct = sum.scheduled ? sum.done / sum.scheduled : 0;
    var perfect = sum.scheduled > 0 && sum.done >= sum.scheduled;

    var node = el('button', {
      class: 'cal-day' + (cell.inMonth ? '' : ' is-out') + (day === today() ? ' is-today' : '') +
             (day === ui.selectedDay ? ' is-selected' : '') + (perfect ? ' is-perfect' : ''),
      type: 'button',
      'data-day': day,
      'data-open-day': '1',
      style: '--hc:' + (perfect ? '#22c55e' : 'var(--text-3)'),
      'aria-label': E.humanDate(day) + ': ' + sum.done + ' of ' + sum.scheduled + ' habits done',
      title: E.humanDate(day) + ' — ' + sum.done + '/' + sum.scheduled
    });

    node.appendChild(el('span', { class: 'num', text: String(E.keyToDate(day).getDate()) }));

    if (sum.scheduled) {
      node.appendChild(el('span', { class: 'cal-ring', style: '--p:' + pct.toFixed(2) }, [el('i', {})]));
    } else if (!isFuture) {
      node.appendChild(el('span', { class: 'cal-dots' }));
    }

    if (!isFuture && sum.scheduled) {
      var dots = el('span', { class: 'cal-dots' });
      active.slice(0, 6).forEach(function (h) {
        if (!E.scheduledOn(h, day)) return;
        var done = E.isComplete(h, store.entries, day);
        dots.appendChild(el('i', {
          class: 'cal-dot' + (done ? ' is-done' : ' is-missed'),
          style: '--hc:' + h.color,
          title: h.name + (done ? ' — done' : ' — missed')
        }));
      });
      node.appendChild(dots);
    }

    return node;
  }

  function dayPanel(active) {
    var day = ui.selectedDay;
    var isFuture = E.diffDays(day, today()) > 0;
    var sum = E.daySummary(active, store.entries, day);

    var panel = el('div', { class: 'panel' }, [
      el('div', { class: 'row-between' }, [
        el('div', {}, [
          el('div', { class: 'bold', text: E.humanDate(day) }),
          el('div', { class: 'tiny dim', text: isFuture ? 'In the future' : sum.done + ' of ' + sum.scheduled + ' completed' })
        ]),
        day === today() ? el('span', { class: 'chip', text: 'Today' }) : null
      ])
    ]);

    if (!active.length) {
      panel.appendChild(el('p', { class: 'small muted', style: 'margin-top:12px', text: 'No habits yet.' }));
      return panel;
    }

    var list = el('div', { class: 'day-list' });
    active.forEach(function (h) {
      var scheduled = E.scheduledOn(h, day);
      var done = scheduled && E.isComplete(h, store.entries, day);
      var v = E.getValue(store.entries, h.id, day);
      var item = el('button', {
        class: 'day-item' + (done ? ' is-done' : ''),
        type: 'button',
        style: '--hc:' + h.color,
        'data-day-toggle': h.id,
        'data-day': day,
        disabled: !scheduled || isFuture,
        title: !scheduled ? 'Not scheduled that day' : isFuture ? 'Not yet' : (done ? 'Tap to undo' : 'Tap to complete')
      }, [
        el('span', { class: 'day-tick', html: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">' + ICONS.check + '</svg>' }),
        el('span', { class: 'habit-emoji', text: h.emoji, 'aria-hidden': 'true', style: 'width:26px;height:26px;font-size:14px;border-radius:8px' }),
        el('span', { class: 'grow' }, [
          el('div', { class: 'small bold truncate', text: h.name }),
          el('div', { class: 'tiny dim', text: !scheduled ? 'not scheduled' : (h.type === 'simple' ? (done ? 'done' : 'not done') : progressText(h, v) || 'not done') })
        ])
      ]);
      list.appendChild(item);
    });
    panel.appendChild(list);

    if (!isFuture && sum.scheduled) {
      var pct = Math.round((sum.done / sum.scheduled) * 100);
      panel.appendChild(el('div', { style: 'margin-top:14px' }, [
        el('div', { class: 'bar', style: '--hc:var(--text-2)' }, [el('div', { class: 'bar-fill', style: 'width:' + pct + '%' })]),
        el('div', { class: 'tiny dim', style: 'margin-top:6px', text: pct + '% of the day completed' })
      ]));
    }

    return panel;
  }

  /* ============================================================ habit form = */

  var EMOJIS = ('✅ 💧 📚 🧘 💪 🏃 🚶 🚴 🏊 🥗 🍎 ☕ 😴 🛏️ 🌙 ☀️ 🦷 🧼 🧹 🧺 💊 🩺 📝 ✍️ 🎯 🎸 🎨 🎧 🎹 📷 ' +
    '💻 ⌨️ 📖 🗣️ 🧠 🙏 🌱 🌿 🚭 🍭 🍫 🚰 🥤 🧊 🧴 💰 📈 🧾 📅 ⏰ 🔥 ⭐ 🌟 🏆 🎓 🧑‍🍳 🐶 🚿 🧳 ✈️ 🚗 🌳 🏋️ 🤸 🧗 ⛰️ 🎾 ⚽ 🏀 🥊 🛹 🎳 🃏 ♟️ 🧩 🔤 🔢 🧪 🎻 🥁 📞 👨‍👩‍👧 💬 😊 🚫 🍵 🥦 🍳 🛒').split(' ');

  function openHabitForm(mode, habitId) {
    ui.formMode = mode;
    if (mode === 'edit') {
      var h = find(habitId);
      if (!h) return;
      ui.form = {
        id: h.id, name: h.name, emoji: h.emoji, color: h.color, type: h.type,
        target: h.target, unit: h.unit, schedule: h.schedule, weekdays: h.weekdays.slice(),
        category: h.category || '', archived: !!h.archived
      };
    } else {
      ui.form = {
        id: null, name: '', emoji: '✅',
        color: E.PALETTE[store.habits.length % E.PALETTE.length],
        type: 'simple', target: 1, unit: 'reps',
        schedule: 'daily', weekdays: [0, 1, 2, 3, 4, 5, 6], category: '', archived: false
      };
    }
    renderForm();
  }

  function renderForm() {
    var f = ui.form;
    var isNew = ui.formMode === 'new';
    var body = el('div', { class: 'modal-body' });

    /* name */
    body.appendChild(el('div', { class: 'field' }, [
      el('label', { for: 'f-name', text: 'Habit name' }),
      el('input', {
        class: 'input', id: 'f-name', type: 'text', maxlength: '60', placeholder: 'e.g. Drink water',
        value: f.name, autofocus: true,
        oninput: function () { f.name = this.value; hideError(); }
      })
    ]));

    /* type */
    var types = [
      { id: 'simple', label: 'Simple', hint: 'Done or not — one tap' },
      { id: 'goal', label: 'Daily target', hint: 'e.g. 20 pages a day' },
      { id: 'count', label: 'Count', hint: 'Every rep adds up' }
    ];
    body.appendChild(el('div', { class: 'field' }, [
      el('label', { text: 'How do you want to track it?' }),
      el('div', { class: 'type-pick' }, types.map(function (t) {
        return el('button', {
          class: 'type-card', type: 'button', 'aria-pressed': f.type === t.id ? 'true' : 'false',
          onclick: function () {
            f.type = t.id;
            if (t.id === 'goal' && f.unit === 'reps') f.unit = 'units';
            if (t.id === 'simple') { f.target = 1; }
            if (t.id === 'count') { f.target = 1; if (f.unit === 'units') f.unit = 'reps'; }
            if (t.id !== 'simple' && !f.target) f.target = 1;
            renderForm();
          }
        }, [el('strong', { text: t.label }), el('span', { text: t.hint })]);
      }))
    ]));

    /* target + unit */
    if (f.type !== 'simple') {
      body.appendChild(el('div', { class: 'field grid-2' }, [
        el('div', {}, [
          el('label', { for: 'f-target', text: f.type === 'goal' ? 'Daily target' : 'Step size per tap' }),
          el('input', {
            class: 'input', id: 'f-target', type: 'number', min: '1', max: '9999', inputmode: 'numeric', value: f.target,
            oninput: function () { f.target = Math.max(1, Math.min(9999, Math.round(Number(this.value) || 1))); }
          })
        ]),
        el('div', {}, [
          el('label', { for: 'f-unit', text: 'Unit' }),
          el('input', {
            class: 'input', id: 'f-unit', type: 'text', maxlength: '12', value: f.unit, placeholder: 'pages',
            oninput: function () { f.unit = this.value; }
          })
        ])
      ]));
    }

    /* schedule */
    body.appendChild(el('div', { class: 'field' }, [
      el('label', { text: 'Repeat' }),
      el('div', { class: 'seg', style: 'width:100%' }, [
        el('button', {
          class: 'seg-btn', type: 'button', 'aria-pressed': f.schedule === 'daily' ? 'true' : 'false',
          text: 'Every day', style: 'flex:1', onclick: function () { f.schedule = 'daily'; renderForm(); }
        }),
        el('button', {
          class: 'seg-btn', type: 'button', 'aria-pressed': f.schedule === 'weekly' ? 'true' : 'false',
          text: 'Specific days', style: 'flex:1',
          onclick: function () { f.schedule = 'weekly'; if (f.weekdays.length === 7) f.weekdays = [1, 2, 3, 4, 5]; renderForm(); }
        })
      ])
    ]));

    if (f.schedule === 'weekly') {
      body.appendChild(el('div', { class: 'field' }, [
        el('label', { text: 'On these days' }),
        el('div', { class: 'weekday-pick' }, [0, 1, 2, 3, 4, 5, 6].map(function (d) {
          return el('button', {
            class: 'wd', type: 'button', 'aria-pressed': f.weekdays.indexOf(d) >= 0 ? 'true' : 'false',
            text: WEEK_LABELS[d], 'aria-label': ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][d],
            onclick: function () {
              var i = f.weekdays.indexOf(d);
              if (i >= 0) f.weekdays.splice(i, 1);
              else f.weekdays.push(d);
              if (!f.weekdays.length) f.weekdays = [d];
              renderForm();
            }
          });
        }))
      ]));
    }

    /* emoji */
    body.appendChild(el('div', { class: 'field' }, [
      el('label', { text: 'Icon' }),
      el('div', { class: 'emoji-grid' }, EMOJIS.map(function (e) {
        return el('button', {
          class: 'emoji-btn', type: 'button', text: e, 'aria-pressed': f.emoji === e ? 'true' : 'false',
          'aria-label': 'Icon ' + e, onclick: function () { f.emoji = e; renderForm(); }
        });
      }))
    ]));

    /* colour */
    body.appendChild(el('div', { class: 'field' }, [
      el('label', { text: 'Colour' }),
      el('div', { class: 'swatches' }, E.PALETTE.map(function (c) {
        return el('button', {
          class: 'swatch', type: 'button', style: 'background:' + c, 'aria-pressed': f.color === c ? 'true' : 'false',
          'aria-label': 'Colour ' + c, onclick: function () { f.color = c; renderForm(); }
        });
      }))
    ]));

    /* category */
    body.appendChild(el('div', { class: 'field' }, [
      el('label', { for: 'f-cat', text: 'Category (optional)' }),
      el('input', {
        class: 'input', id: 'f-cat', type: 'text', maxlength: '24', value: f.category, placeholder: 'Health',
        list: 'cat-list', oninput: function () { f.category = this.value; }
      }),
      el('datalist', { id: 'cat-list' }, categories().map(function (c) { return el('option', { value: c }); }))
    ]));

    var err = el('div', { class: 'field', id: 'form-error', hidden: true }, [
      el('p', { class: 'small', style: 'color:var(--danger)' })
    ]);
    function showError(msg) {
      err.hidden = false;
      $('p', err).textContent = msg;
      $('.input', body).focus();
    }
    function hideError() { err.hidden = true; }
    body.appendChild(err);

    var node = el('div', { class: 'modal modal-wide', role: 'dialog', 'aria-modal': 'true', 'aria-label': isNew ? 'New habit' : 'Edit habit' }, [
      el('div', { class: 'modal-head' }, [
        el('h2', { class: 'modal-title', text: isNew ? 'New habit' : 'Edit habit' }),
        el('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Close', html: icon('x', 18), onclick: closeModal })
      ]),
      body,
      el('div', { class: 'modal-foot' }, [
        !isNew ? el('button', {
          class: 'btn btn-ghost', type: 'button', text: find(f.id) && find(f.id).archived ? 'Unarchive' : 'Archive',
          title: find(f.id) && find(f.id).archived ? 'Show this habit in the list again' : 'Hide from the list but keep its history',
          onclick: function () {
            var h = find(f.id);
            if (!h) return;
            if (h.archived) {
              h.archived = false;
              touch(h);
              tick(); save(); closeModal(); render();
              toast('“' + h.name + '” is active again');
            } else {
              h.archived = true;
              touch(h);
              tick(); save(); closeModal(); render();
              toast('Archived “' + h.name + '”', { label: 'Undo', run: function () { h.archived = false; touch(h); tick(); save(); render(); } });
            }
          }
        }) : null,
        el('span', { class: 'grow' }),
        el('button', { class: 'btn', type: 'button', text: 'Cancel', onclick: closeModal }),
        el('button', {
          class: 'btn btn-primary', type: 'button', text: isNew ? 'Create habit' : 'Save changes',
          onclick: function () {
            var name = f.name.trim();
            if (!name) { showError('Give your habit a name.'); return; }
            var exists = store.habits.some(function (h) {
              return h.id !== f.id && !h.archived && h.name.toLowerCase() === name.toLowerCase();
            });
            if (exists) { showError('You already have a habit called “' + name + '”.'); return; }

            if (isNew) {
              var habit = E.normalizeHabit({
                id: E.uid(), name: name, emoji: f.emoji, color: f.color, type: f.type,
                target: f.type === 'simple' ? 1 : f.target, unit: f.unit,
                schedule: f.schedule, weekdays: f.weekdays, category: f.category.trim(),
                createdAt: today(), updatedAt: Date.now()
              }, today());
              store.habits.push(habit);
              tick();
              save(); closeModal(); render();
              toast('“' + habit.name + '” created');
            } else {
              var target = find(f.id);
              if (!target) return;
              target.name = name;
              target.emoji = f.emoji;
              target.color = f.color;
              target.type = f.type;
              target.target = f.type === 'simple' ? 1 : f.target;
              target.unit = f.unit;
              target.schedule = f.schedule;
              target.weekdays = f.weekdays.slice().sort(function (a, b) { return a - b; });
              target.category = f.category.trim();
              touch(target);
              tick();
              save(); closeModal(); render();
              toast('Saved');
            }
          }
        })
      ])
    ]);

    var modal = el('div', {}, [node]);
    openModal(node, { onScrim: closeModal });
    var nameInput = $('#f-name', node);
    if (nameInput) nameInput.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') { ev.preventDefault(); $('.btn-primary', node).click(); }
    });
  }

  /* ============================================================== settings = */

  function settingsTabs() {
    return [
      { id: 'app', label: 'App', icon: 'settings' },
      { id: 'cloud', label: 'Sync', icon: 'cloud' },
      { id: 'data', label: 'Data', icon: 'download' }
    ];
  }

  function openSettings() {
    var s = store.settings;
    var tabs = settingsTabs();

    var body = el('div', { class: 'modal-body' }, [
      el('div', { class: 'tabs', role: 'tablist', 'aria-label': 'Settings sections' }, tabs.map(function (t) {
        return el('button', {
          class: 'tab', type: 'button', role: 'tab', 'data-tab': t.id,
          'aria-selected': ui.settingsTab === t.id ? 'true' : 'false',
          html: icon(t.icon, 15) + '<span>' + t.label + '</span>',
          onclick: function () { ui.settingsTab = t.id; ui.syncNote = null; openSettings(); }
        });
      })),
      ui.settingsTab === 'cloud' ? cloudPanel() :
        ui.settingsTab === 'data' ? dataPanel() : appPanel(s)
    ]);

    var node = el('div', { class: 'modal modal-wide', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Settings' }, [
      el('div', { class: 'modal-head' }, [
        el('h2', { class: 'modal-title', text: 'Settings' }),
        el('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Close', html: icon('x', 18), onclick: closeModal })
      ]),
      body
    ]);
    openModal(node);
  }

  function note() {
    if (!ui.syncNote) return null;
    return el('div', { class: 'note is-' + (ui.syncNote.tone || 'info') }, [
      el('span', { html: icon(ui.syncNote.tone === 'error' ? 'x' : 'lock', 15), style: 'display:flex;margin-top:1px' }),
      el('span', { text: ui.syncNote.text })
    ]);
  }

  /* --- App tab --------------------------------------------------------- */

  function appPanel(s) {
    return el('div', {}, [
      el('div', { class: 'set-row' }, [
        el('div', {}, [
          el('div', { class: 'set-label', text: 'Your data stays here' }),
          el('div', { class: 'set-hint', text: 'No account, no tracking. Habits live in this browser’s storage on this device — and in your own Firebase room if you turn on sync.' })
        ]),
        el('span', { html: icon('lock', 18), style: 'display:flex;color:var(--text-3)' })
      ]),

      el('div', { class: 'set-row' }, [
        el('div', {}, [
          el('div', { class: 'set-label', text: 'Appearance' }),
          el('div', { class: 'set-hint', text: 'Switch between the dark and light theme.' })
        ]),
        el('div', { class: 'seg' }, [
          el('button', {
            class: 'seg-btn', type: 'button', 'aria-pressed': s.theme === 'dark' ? 'true' : 'false',
            html: icon('moon', 14) + '<span>Dark</span>',
            onclick: function () { applyTheme('dark'); openSettings(); }
          }),
          el('button', {
            class: 'seg-btn', type: 'button', 'aria-pressed': s.theme === 'light' ? 'true' : 'false',
            html: icon('sun', 14) + '<span>Light</span>',
            onclick: function () { applyTheme('light'); openSettings(); }
          })
        ])
      ]),

      el('div', { class: 'set-row' }, [
        el('div', {}, [
          el('div', { class: 'set-label', text: 'Week starts on' }),
          el('div', { class: 'set-hint', text: 'Changes the layout of the heatmaps and calendar. This setting syncs.' })
        ]),
        el('div', { class: 'seg' }, [
          el('button', {
            class: 'seg-btn', type: 'button', 'aria-pressed': s.weekStart === 1 ? 'true' : 'false', text: 'Monday',
            onclick: function () { s.weekStart = 1; tick(); save(); render(); openSettings(); }
          }),
          el('button', {
            class: 'seg-btn', type: 'button', 'aria-pressed': s.weekStart === 0 ? 'true' : 'false', text: 'Sunday',
            onclick: function () { s.weekStart = 0; tick(); save(); render(); openSettings(); }
          })
        ])
      ]),

      store.habits.some(function (h) { return h.archived; }) ? el('div', { class: 'set-row' }, [
        el('div', {}, [
          el('div', { class: 'set-label', text: 'Archived habits' }),
          el('div', { class: 'set-hint', text: 'Show habits you archived, so you can unarchive or delete them.' })
        ]),
        el('button', {
          class: 'chip', type: 'button', 'aria-pressed': s.showArchived ? 'true' : 'false',
          text: s.showArchived ? 'Showing' : 'Hidden',
          onclick: function () { s.showArchived = !s.showArchived; tick(); save(); render(); openSettings(); }
        })
      ]) : null,

      el('div', { class: 'set-row' }, [
        el('div', {}, [
          el('div', { class: 'set-label', text: 'This device' }),
          el('div', { class: 'set-hint', text: 'Devices are told apart so edits can be merged without guessing.' })
        ]),
        el('code', { class: 'code-inline', text: (s.cloud && s.cloud.device) || deviceName() })
      ]),

      el('div', { class: 'set-row' }, [
        el('div', {}, [
          el('div', { class: 'set-label', text: 'Keyboard' }),
          el('div', { class: 'set-hint', text: 'N new habit · T today · C calendar · Esc close' })
        ])
      ])
    ]);
  }

  /* --- Data tab -------------------------------------------------------- */

  function dataPanel() {
    return el('div', {}, [
      el('div', { class: 'set-row' }, [
        el('div', {}, [
          el('div', { class: 'set-label', text: 'Export backup' }),
          el('div', { class: 'set-hint', text: 'Download a JSON file with every habit and check-in.' })
        ]),
        el('button', { class: 'btn btn-sm', type: 'button', html: icon('download', 15) + '<span>Export</span>', onclick: exportData })
      ]),

      el('div', { class: 'set-row' }, [
        el('div', {}, [
          el('div', { class: 'set-label', text: 'Import backup' }),
          el('div', { class: 'set-hint', text: 'Restore from a file you exported earlier. This replaces what is here now.' })
        ]),
        el('button', { class: 'btn btn-sm', type: 'button', html: icon('upload', 15) + '<span>Import</span>', onclick: importData })
      ]),

      el('div', { class: 'set-row' }, [
        el('div', {}, [
          el('div', { class: 'set-label', text: 'What is stored' }),
          el('div', { class: 'set-hint', text: habitCount() + ' habits · ' +
            E.overall(habits(), store.entries, today()).totalChecks + ' check-ins · ' + storageSize() + ' on this device' })
        ])
      ]),

      el('div', { class: 'danger-zone' }, [
        el('h4', { text: 'Danger zone' }),
        el('div', { class: 'set-row' }, [
          el('div', {}, [
            el('div', { class: 'set-label', text: 'Delete everything' }),
            el('div', { class: 'set-hint', text: 'Permanently removes all habits and history from this device.' })
          ]),
          el('button', {
            class: 'btn btn-sm btn-danger', type: 'button', text: 'Delete all',
            onclick: function () {
              closeModal();
              confirmModal({
                title: 'Delete everything?',
                body: 'All habits and every check-in will be erased from this device. This cannot be undone — export a backup first if you might want it back. If sync is on, the deletion will reach your other devices too.',
                confirmLabel: 'Delete everything', danger: true,
                onConfirm: function () {
                  var cloudCfg = store.settings.cloud;
                  var device = store.deviceId;
                  var config = cloud.config;
                  // Tombstone every habit so the wipe propagates instead of being
                  // undone by the next merge with a device that still has them.
                  var deleted = store.deleted || {};
                  store.habits.forEach(function (h) { deleted[h.id] = Date.now(); });
                  store = E.emptyState();
                  store.deviceId = device || E.newDeviceId();
                  store.settings.cloud = cloudCfg || E.emptyCloud();
                  store.settings.seeded = true;
                  store.deleted = deleted;
                  cloud.config = config;
                  ensureIdentity();
                  tick();
                  saveNow();
                  if (cloudReady()) cloud.transport.push(docForCloud());
                  render();
                  toast('Everything deleted');
                }
              });
            }
          })
        ])
      ])
    ]);
  }

  function habitCount() {
    var n = habits().length;
    return n + (n === 1 ? ' habit' : ' habits');
  }

  function storageSize() {
    try {
      var raw = localStorage.getItem(LS_KEY) || '';
      var kb = raw.length / 1024;
      return kb < 1024 ? kb.toFixed(1) + ' KB' : (kb / 1024).toFixed(1) + ' MB';
    } catch (err) { return 'unknown size'; }
  }

  /* --- Sync tab -------------------------------------------------------- */

  function cloudPanel() {
    var s = store.settings;
    var on = s.cloud && s.cloud.enabled;

    if (!Cloud) {
      return el('div', {}, [
        note(),
        el('p', { class: 'small muted', text: 'The sync module did not load, so cloud sync is unavailable in this copy.' })
      ]);
    }

    return on ? cloudConnectedPanel(s) : cloudSetupPanel(s);
  }

  function cloudSetupPanel(s) {
    var hasConfig = !!cloud.config;

    return el('div', {}, [
      note(),

      el('div', { class: 'note is-info' }, [
        el('span', { html: icon('lock', 15), style: 'display:flex;margin-top:1px' }),
        el('span', {
          text: 'Sync stores your habits in your own free Firebase Realtime Database. There is no account: ' +
            'a long random sync code keeps the room private, and you paste that code into your other devices once. ' +
            'Treat it like a password — anyone who has the code can read and edit your habits.'
        })
      ]),

      /* step 1: config */
      el('div', { class: 'step' }, [
        el('div', { class: 'step-head' }, [
          el('span', { class: 'step-num', text: '1' }),
          el('div', {}, [
            el('div', { class: 'set-label', text: hasConfig ? 'Firebase config — connected' : 'Paste your Firebase config' }),
            el('div', { class: 'set-hint', text: hasConfig
              ? 'Saved on this device. ' + cloud.config.databaseURL.replace(/^https:\/\//, '')
              : 'Firebase console → Project settings → Your apps → SDK setup. Copy the firebaseConfig object.' })
          ])
        ]),
        hasConfig ? el('div', { class: 'row', style: 'margin-top:10px' }, [
          el('button', {
            class: 'btn btn-sm', type: 'button', text: 'Replace config',
            onclick: function () { cloud.config = null; saveConfig(null); openSettings(); }
          })
        ]) : el('div', {}, [
          el('textarea', {
            class: 'input', rows: '5', placeholder: '{\n  "apiKey": "AIza…",\n  "databaseURL": "https://your-project-default-rtdb.firebaseio.com"\n}',
            value: ui.configDraft,
            oninput: function () { ui.configDraft = this.value; }
          }),
          el('div', { class: 'row', style: 'margin-top:10px' }, [
            el('button', {
              class: 'btn btn-sm btn-primary', type: 'button', text: 'Save config',
              onclick: function () {
                var parsed = Cloud.parsePastedConfig(ui.configDraft);
                if (parsed.error) { ui.syncNote = { tone: 'error', text: parsed.error }; openSettings(); return; }
                cloud.config = parsed.config;
                saveConfig(parsed.config);
                ui.syncNote = { tone: 'ok', text: 'Config saved. Now create or enter a sync code below.' };
                openSettings();
              }
            })
          ])
        ])
      ]),

      /* step 2: code */
      el('div', { class: 'step' }, [
        el('div', { class: 'step-head' }, [
          el('span', { class: 'step-num', text: '2' }),
          el('div', {}, [
            el('div', { class: 'set-label', text: 'Choose a sync code' }),
            el('div', { class: 'set-hint', text: 'Starting fresh? Generate one. Already syncing on another device? Type the code that device shows you.' })
          ])
        ]),
        el('div', { class: 'row', style: 'margin-top:10px;flex-wrap:wrap' }, [
          el('button', {
            class: 'btn btn-sm', type: 'button', html: icon('sparkle', 15) + '<span>Generate a code</span>',
            onclick: function () {
              ui.codeDraft = E.newRoomCode();
              ui.syncNote = { tone: 'info', text: 'Code ready. Give it a name below, then tap “Turn on sync”.' };
              openSettings();
            }
          }),
          el('span', { class: 'dim tiny', text: 'or' }),
          el('input', {
            class: 'input', style: 'flex:1 1 200px;min-width:180px;font-family:var(--mono);letter-spacing:.06em',
            placeholder: 'K7QW3M-9XRTPB-2HJ4ND-8VZQK5', value: ui.codeDraft, spellcheck: 'false',
            'aria-label': 'Sync code',
            oninput: function () { ui.codeDraft = this.value; }
          })
        ])
      ]),

      ui.codeDraft ? el('div', { class: 'field', style: 'margin-top:16px' }, [
        el('label', { text: 'Name this device (optional)' }),
        el('input', {
          class: 'input', type: 'text', maxlength: '32', value: s.cloud.device || deviceName(),
          'aria-label': 'Device name',
          oninput: function () { s.cloud.device = this.value; }
        })
      ]) : null,

      el('div', { class: 'modal-actions' }, [
        el('button', {
          class: 'btn btn-primary', type: 'button', disabled: (!hasConfig || !ui.codeDraft) ? true : false,
          html: icon('cloud', 16) + '<span>Turn on sync</span>',
          onclick: function () { enableSync(ui.codeDraft, s.cloud.device || deviceName()); }
        }),
        el('button', {
          class: 'btn', type: 'button', text: 'Test connection',
          onclick: function () { testConnection(ui.codeDraft); }
        })
      ])
    ]);
  }

  function cloudConnectedPanel(s) {
    var st = cloud.status;
    var lines = [
      { k: 'Status', v: syncStatusLabel() + (st.lastError ? ' — ' + st.lastError : '') },
      { k: 'Last synced', v: relativeTime(st.lastSync) },
      { k: 'Database', v: (cloud.config ? cloud.config.databaseURL.replace(/^https:\/\//, '') : 'not configured') },
      { k: 'Changes sent / received', v: st.pushed + ' / ' + st.received },
      { k: 'This device', v: (s.cloud.device || deviceName()) }
    ];

    return el('div', {}, [
      note(),

      el('div', { class: 'step' }, [
        el('div', { class: 'step-head' }, [
          el('span', { class: 'step-num is-on', html: icon('check', 13) }),
          el('div', {}, [
            el('div', { class: 'set-label', text: 'Sync is on' }),
            el('div', { class: 'set-hint', text: 'Changes travel to your other devices within a few seconds, and are saved locally first either way.' })
          ])
        ])
      ]),

      el('div', { class: 'set-row' }, [
        el('div', {}, [
          el('div', { class: 'set-label', text: 'Sync code' }),
          el('div', { class: 'set-hint', text: 'Enter this on your other device. Treat it like a password — anyone who has it can read and edit your habits.' })
        ]),
        el('div', { class: 'row' }, [
          el('code', { class: 'code-inline is-big', text: E.formatCode(s.cloud.code || '') || '—' }),
          el('button', {
            class: 'btn btn-sm', type: 'button', text: 'Copy',
            onclick: function () { copyText(E.formatCode(s.cloud.code || ''), 'Sync code copied'); }
          })
        ])
      ]),

      el('div', { class: 'set-row' }, [
        el('div', {}, [
          el('div', { class: 'set-label', text: 'Devices in this room' }),
          el('div', { class: 'set-hint', text: ui.devices
            ? Object.keys(ui.devices).length + ' device(s) have synced here.'
            : 'Fetch the device list to check both devices are in the same room.' })
        ]),
        el('div', { class: 'row' }, [
          el('button', {
            class: 'btn btn-sm', type: 'button', text: ui.devices ? 'Refresh' : 'Check',
            onclick: function () {
              if (!cloud.transport) { ui.syncNote = { tone: 'error', text: 'Not connected.' }; openSettings(); return; }
              cloud.transport.readMeta().then(function (meta) {
                ui.devices = meta || {};
                ui.syncNote = { tone: 'ok', text: 'Found ' + Object.keys(ui.devices).length + ' device(s) in this room.' };
                openSettings();
              });
            }
          })
        ])
      ]),

      ui.devices ? el('div', { class: 'device-list' }, Object.keys(ui.devices).map(function (id) {
        var d = ui.devices[id] || {};
        return el('div', { class: 'device-row' }, [
          el('span', { class: 'dot', style: 'background:' + (id === store.deviceId ? 'var(--hc, #22c55e)' : 'var(--text-3)') }),
          el('span', { class: 'grow small truncate', text: (d.name || 'Unknown device') + (id === store.deviceId ? ' (this one)' : '') }),
          el('span', { class: 'tiny dim', text: relativeTime(d.at) })
        ]);
      })) : null,

      el('div', { class: 'kv' }, lines.map(function (l) {
        return el('div', { class: 'kv-row' }, [
          el('span', { class: 'kv-k', text: l.k }),
          el('span', { class: 'kv-v truncate', text: l.v, title: l.v })
        ]);
      })),

      el('div', { class: 'modal-actions' }, [
        el('button', {
          class: 'btn', type: 'button', html: icon('repeat', 15) + '<span>Sync now</span>',
          onclick: function () {
            if (!cloud.transport) return;
            ui.syncNote = { tone: 'info', text: 'Syncing…' };
            cloud.transport.pull().then(function () {
              if (!cloud.applying) cloud.transport.push(docForCloud());
              ui.syncNote = { tone: 'ok', text: 'Sync finished.' };
              openSettings();
            });
          }
        }),
        el('button', {
          class: 'btn', type: 'button', text: 'Turn off on this device',
          onclick: function () {
            stopSync(true);
            saveNow();
            ui.syncNote = { tone: 'info', text: 'Sync is off here. Your data stays on this device, and the cloud copy is untouched.' };
            openSettings();
          }
        }),
        el('span', { class: 'grow' }),
        el('button', {
          class: 'btn btn-danger', type: 'button', text: 'Delete cloud data',
          onclick: function () {
            closeModal();
            confirmModal({
              title: 'Delete the cloud copy?',
              body: 'The room in your Firebase database will be emptied and sync will stop here. Habits on this device are kept. Other devices will still hold their own copies until they sync.',
              confirmLabel: 'Delete cloud data', danger: true,
              onConfirm: function () {
                if (cloud.transport) {
                  cloud.transport.clearRoom().then(function () {
                    stopSync(true);
                    saveNow();
                    toast('Cloud copy deleted');
                    openSettings();
                  }).catch(function (err) {
                    ui.syncNote = { tone: 'error', text: err.message || String(err) };
                    openSettings();
                  });
                } else {
                  stopSync(true); saveNow(); openSettings();
                }
              }
            });
          }
        })
      ])
    ]);
  }

  /* --- sync actions ---------------------------------------------------- */

  function enableSync(code, device) {
    var canonical = E.canonicalCode(code);
    if (canonical.length < 8) {
      ui.syncNote = { tone: 'error', text: 'That sync code is too short. Use the generated one, or at least 8 characters.' };
      openSettings();
      return;
    }
    if (!cloud.config) {
      ui.syncNote = { tone: 'error', text: 'Add your Firebase config first.' };
      openSettings();
      return;
    }

    store.settings.cloud = {
      enabled: true,
      code: canonical,
      room: E.roomKeyFromCode(canonical),
      device: device || deviceName(),
      lastSync: 0
    };
    tick();
    saveNow();
    ui.busy = true;
    ui.syncNote = { tone: 'info', text: 'Connecting to Firebase…' };
    openSettings();

    startSync().then(function (ok) {
      ui.busy = false;
      if (!ok) {
        ui.syncNote = { tone: 'error', text: cloud.status.lastError || 'Could not connect. Check the config and the database rules.' };
      } else {
        ui.syncNote = { tone: 'ok', text: 'Sync is on. Enter the same code on your other device.' };
      }
      openSettings();
      toast(ok ? 'Sync turned on' : 'Sync could not connect', null, ok ? undefined : 'warn');
    });
  }

  function testConnection(code) {
    if (!cloud.config) {
      ui.syncNote = { tone: 'error', text: 'Save a Firebase config first.' };
      openSettings();
      return;
    }
    var canonical = E.canonicalCode(code || ui.codeDraft);
    if (canonical.length < 8) {
      ui.syncNote = { tone: 'error', text: 'Enter or generate a sync code first, so the test uses the right room.' };
      openSettings();
      return;
    }
    ui.syncNote = { tone: 'info', text: 'Testing…' };
    openSettings();
    var probe = Cloud.createTransport(cloud.config, E.roomKeyFromCode(canonical), {});
    probe.test().then(function (res) {
      ui.syncNote = { tone: 'ok', text: res.empty
        ? 'Connection works — that room is empty, so this device will fill it.'
        : 'Connection works — that room already has data, which will be merged in.' };
      openSettings();
    }).catch(function (err) {
      ui.syncNote = { tone: 'error', text: err.message || String(err) };
      openSettings();
    });
  }

  function copyText(text, message) {
    var done = function () { toast(message || 'Copied'); };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, done); });
        return;
      }
    } catch (err) { /* fall through */ }
    fallbackCopy(text, done);
  }

  function fallbackCopy(text, done) {
    // clipboard API needs a secure context; file:// pages fall back to this.
    var ta = el('textarea', { style: 'position:fixed;top:-1000px', value: text });
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
    document.body.removeChild(ta);
    if (ok) done();
    else confirmModal({ title: 'Copy this', body: text, confirmLabel: 'Done', onConfirm: function () {} });
  }

  function applyTheme(theme) {
    store.settings.theme = theme;
    document.documentElement.setAttribute('data-theme', theme);
    var meta = $('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'dark' ? '#0b0d10' : '#f6f7f9');
    save();
    var btn = $('#theme-btn');
    if (btn) btn.innerHTML = icon(theme === 'dark' ? 'sun' : 'moon', 17);
    var lbl = $('#theme-btn .sr-only');
    if (lbl) lbl.textContent = 'Switch to ' + (theme === 'dark' ? 'light' : 'dark') + ' theme';
  }

  /* ================================================================ IO ==== */

  function exportData() {
    var text = E.serialize(store);
    var name = 'habitbox-backup-' + today() + '.json';
    try {
      var blob = new Blob([text], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = el('a', { href: url, download: name });
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      toast('Backup downloaded');
    } catch (err) {
      // Fallback for environments that block downloads.
      confirmModal({
        title: 'Copy your backup',
        body: 'Downloads are blocked here. Copy this text and save it as ' + name + ':\n\n' + text.slice(0, 1200) + '…',
        confirmLabel: 'OK', onConfirm: function () {}
      });
    }
  }

  function importData() {
    var input = el('input', { type: 'file', accept: '.json,application/json', style: 'display:none' });
    document.body.appendChild(input);
    input.addEventListener('change', function () {
      var file = input.files && input.files[0];
      if (!file) { input.remove(); return; }
      var reader = new FileReader();
      reader.onload = function () {
        var res = E.deserialize(String(reader.result));
        document.body.removeChild(input);
        if (res.error) { toast(res.error, null, 'warn'); return; }
        confirmModal({
          title: 'Replace your data?',
          body: 'The backup contains ' + res.state.habits.length + ' habits. Importing replaces everything currently on this device.',
          confirmLabel: 'Import',
          onConfirm: function () {
            var device = store.deviceId;
            var cloudCfg = store.settings.cloud;
            store = res.state;
            store.deviceId = device || E.newDeviceId();
            store.settings.cloud = cloudCfg || E.emptyCloud();
            store.settings.seeded = true;
            ensureIdentity();
            tick();
            saveNow();
            if (cloudReady()) cloud.transport.push(docForCloud());
            ui.month = E.monthStart(today());
            ui.selectedDay = today();
            applyTheme(store.settings.theme || 'dark');
            closeModal();
            render();
            toast('Backup imported');
          }
        });
      };
      reader.onerror = function () { toast('Could not read that file', null, 'warn'); document.body.removeChild(input); };
      reader.readAsText(file);
    });
    input.click();
  }

  /* ============================================================== actions = */

  /** Write one day's value as this device, stamped so merges can order it. */
  function writeDay(habitId, day, value) {
    E.setValue(store.entries, habitId, day, value, Date.now(), store.deviceId);
    tick();
  }

  /** Tap a habit's check button. */
  function bumpHabit(id) {
    var h = find(id);
    if (!h) return;
    var day = today();
    var before = E.getValue(store.entries, h.id, day);
    var wasDone = E.isComplete(h, store.entries, day);

    if (h.type === 'simple') {
      writeDay(h.id, day, before > 0 ? 0 : 1);
    } else if (h.type === 'count') {
      // Every tap adds one rep; the Undo button takes them back off.
      writeDay(h.id, day, before + 1);
    } else {
      if (wasDone) {
        writeDay(h.id, day, 0);
      } else {
        var step = h.target <= 4 ? 1 : Math.ceil(h.target / 5);
        var next = before + step;
        writeDay(h.id, day, next >= h.target ? h.target : next);
      }
    }

    var nowDone = E.isComplete(h, store.entries, day);
    save();
    renderList();
    renderStatsOnly();

    if (nowDone && !wasDone) {
      var st = E.stats(h, store.entries, day);
      var all = E.overall(habits(), store.entries, day);
      if (all.todayScheduled > 0 && all.todayDone >= all.todayScheduled) {
        toast('🎉 Every habit done today' + (all.perfectStreak > 1 ? ' — ' + all.perfectStreak + ' days in a row' : ''));
      } else if (st.current > 1) {
        toast('🔥 ' + st.current + ' day streak on “' + h.name + '”');
      }
    }
  }

  function renderStatsOnly() {
    // Cheap path: refresh the stat tiles without rebuilding the whole page.
    var tiles = $('#view-today .stats');
    if (!tiles) return;
    var o = E.overall(habits(), store.entries, today());
    var values = tiles.querySelectorAll('.stat');
    if (values.length < 4) return;
    var data = [
      [o.todayScheduled ? o.todayDone + '/' + o.todayScheduled : '0', o.todayScheduled ? Math.round((o.todayRate || 0) * 100) + '% complete' : 'No habits due'],
      [String(o.perfectStreak), o.perfectStreak === 1 ? 'day with everything done' : 'days with everything done'],
      [String(o.best), o.bestHabit ? 'on ' + o.bestHabit : 'no streak yet'],
      [o.avg30 === null ? '—' : Math.round(o.avg30 * 100) + '%', o.totalChecks + ' check-ins all time']
    ];
    values.forEach(function (tile, i) {
      var v = tile.querySelector('.stat-value span');
      var f = tile.querySelector('.stat-foot');
      if (v) v.textContent = data[i][0];
      if (f) f.textContent = data[i][1];
    });
  }

  function toggleDayFor(habitId, day) {
    var h = find(habitId);
    if (!h) return;
    if (E.diffDays(day, today()) > 0) { toast('That day has not happened yet', null, 'warn'); return; }
    var done = E.isComplete(h, store.entries, day);
    writeDay(h.id, day, done ? 0 : (h.type === 'simple' ? 1 : h.target));
    save();
    render();
  }

  function deleteHabit(id) {
    var h = find(id);
    if (!h) return;
    var entries = store.entries[h.id];
    confirmModal({
      title: 'Delete “' + h.name + '”?',
      body: 'Its full history will be removed from this device — and from your other synced devices. You can also archive it instead to keep the history but hide it from the list.',
      confirmLabel: 'Delete habit', danger: true,
      onConfirm: function () {
        store.habits = store.habits.filter(function (x) { return x.id !== id; });
        delete store.entries[id];
        // A tombstone makes the delete travel to devices that still have it.
        store.deleted[id] = Date.now();
        tick();
        save();
        render();
        toast('“' + h.name + '” deleted', {
          label: 'Undo',
          run: function () {
            store.habits.push(h);
            if (entries) store.entries[id] = entries;
            delete store.deleted[id];
            touch(h);
            tick();
            save(); render();
          }
        });
      }
    });
  }

  /* =============================================================== render = */

  function render() {
    document.documentElement.setAttribute('data-theme', store.settings.theme || 'dark');
    $('#view-today').hidden = ui.view !== 'today';
    $('#view-calendar').hidden = ui.view !== 'calendar';
    $$('#view-switch .seg-btn').forEach(function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-view') === ui.view ? 'true' : 'false');
    });
    if (ui.view === 'today') renderToday();
    else renderCalendar();

    var foot = $('#habit-count');
    if (foot) {
      var n = habits().length;
      foot.textContent = n + (n === 1 ? ' habit' : ' habits') + ' · ' + E.overall(habits(), store.entries, today()).totalChecks + ' check-ins · stored on this device';
    }
  }

  /* =============================================================== events = */

  function bindGlobal() {
    document.addEventListener('click', function (ev) {
      var t = ev.target;
      var hit = function (sel) { return t.closest ? t.closest(sel) : null; };

      var newNode = hit('[data-new]');
      if (newNode) { openHabitForm('new'); return; }

      var bump = hit('[data-bump]');
      if (bump) { bumpHabit(bump.getAttribute('data-bump')); return; }

      var undoTap = hit('[data-undo]');
      if (undoTap) {
        var uh = find(undoTap.getAttribute('data-undo'));
        if (uh) {
          var cur = E.getValue(store.entries, uh.id, today());
          var step = uh.type === 'goal' ? (uh.target <= 4 ? 1 : Math.ceil(uh.target / 5)) : 1;
          writeDay(uh.id, today(), Math.max(0, cur - step));
          save(); renderList(); renderStatsOnly();
        }
        return;
      }

      var edit = hit('[data-edit]');
      if (edit) { openHabitForm('edit', edit.getAttribute('data-edit')); return; }

      var del = hit('[data-del]');
      if (del) { deleteHabit(del.getAttribute('data-del')); return; }

      var heatToggle = hit('[data-toggle-heat]');
      if (heatToggle) {
        var hid = heatToggle.getAttribute('data-toggle-heat');
        ui.openHeat[hid] = !ui.openHeat[hid];
        renderList();
        return;
      }

      var dayToggle = hit('[data-day-toggle]');
      if (dayToggle && !dayToggle.disabled) {
        toggleDayFor(dayToggle.getAttribute('data-day-toggle'), dayToggle.getAttribute('data-day'));
        return;
      }

      var openDay = hit('[data-open-day]');
      if (openDay) {
        ui.selectedDay = openDay.getAttribute('data-day');
        if (ui.view !== 'calendar') { ui.view = 'calendar'; ui.month = E.monthStart(ui.selectedDay); render(); }
        else renderCalendar();
        var dayStr = ui.selectedDay;
        var dayNode = document.querySelector('.cal-day[data-day="' + dayStr + '"]');
        if (dayNode && dayNode.scrollIntoView) dayNode.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        return;
      }

      var monthBtn = hit('[data-month]');
      if (monthBtn) {
        var v = monthBtn.getAttribute('data-month');
        ui.month = v === 'today' ? E.monthStart(today()) : E.addMonths(ui.month, Number(v));
        if (v === 'today') ui.selectedDay = today();
        renderCalendar();
        return;
      }

      var heatCell = hit('[data-heat][data-habit]');
      if (heatCell) {
        var cellDay = heatCell.getAttribute('data-day');
        ui.selectedDay = cellDay;
        ui.view = 'calendar';
        ui.month = E.monthStart(cellDay);
        render();
        return;
      }

      var syncChip = hit('#sync-chip');
      if (syncChip) {
        if (cloud.transport) {
          syncChip.textContent = 'Syncing…';
          cloud.transport.pull().then(function () { toast('Checked for changes'); });
        } else {
          ui.settingsTab = 'cloud';
          openSettings();
        }
        return;
      }

      var sw = hit('[data-view]');
      if (sw) { ui.view = sw.getAttribute('data-view'); render(); return; }
    });

    $('#theme-btn').addEventListener('click', function () {
      applyTheme((store.settings.theme || 'dark') === 'dark' ? 'light' : 'dark');
    });

    $('#settings-btn').addEventListener('click', openSettings);

    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') {
        if (openModalEl) { closeModal(); ev.preventDefault(); return; }
        if (ui.view === 'calendar') { ui.view = 'today'; render(); ev.preventDefault(); }
        return;
      }
      var typing = /^(input|textarea|select)$/i.test((ev.target.tagName || '')) || ev.target.isContentEditable;
      if (typing || openModalEl) return;
      if (ev.key === 'n' || ev.key === 'N') { openHabitForm('new'); ev.preventDefault(); }
      else if (ev.key === 't' || ev.key === 'T') { ui.view = 'today'; render(); ev.preventDefault(); }
      else if (ev.key === 'c' || ev.key === 'C') { ui.view = 'calendar'; render(); ev.preventDefault(); }
      else if (ev.key === '?') { openSettings(); ev.preventDefault(); }
    });

    // Keep the view in sync when the day rolls over or another tab writes.
    window.addEventListener('storage', function (ev) {
      if (ev.key === LS_CONFIG) { cloud.config = loadConfig(); return; }
      if (ev.key !== LS_KEY) return;
      var incoming;
      try { incoming = E.migrate(JSON.parse(ev.newValue || '{}')); } catch (err) { return; }
      // Another tab may have checked something off; fold it in rather than replacing.
      adopt(E.mergeStates(docForCloud(), incoming), true);
    });

    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState !== 'visible') return;
      // Coming back to the tab may cross midnight, and may be the moment a
      // sleeping phone regains a network — so re-render and pull.
      if (document.body.dataset.bootDay !== today()) {
        document.body.dataset.bootDay = today();
        render();
      }
      if (cloud.transport) cloud.transport.pull();
    });

    window.addEventListener('online', function () {
      if (cloud.transport) {
        cloud.transport.pull().then(function () { cloud.transport.push(docForCloud()); });
      }
    });
  }

  function boot() {
    document.body.dataset.bootDay = today();
    applyTheme(store.settings.theme || 'dark');
    if (!store.habits.length && !store.settings.seeded) {
      store = E.seed();
      store.settings.theme = store.settings.theme || 'dark';
      saveNow();
    }
    ensureIdentity();
    cloud.config = loadConfig();

    bindGlobal();
    render();

    if (store.settings.cloud.enabled && cloud.config) {
      startSync().then(function (ok) {
        if (!ok && cloud.status.lastError) {
          toast('Sync problem: ' + cloud.status.lastError, null, 'warn');
        }
      });
    }

    // Expose a small surface for debugging and for the headless UI tests.
    window.HabitBox = {
      state: function () { return store; },
      engine: E,
      cloud: Cloud,
      sync: {
        status: function () { return cloud.status; },
        start: startSync,
        stop: stopSync,
        push: function () { return cloud.transport ? cloud.transport.push(docForCloud()) : null; },
        pull: function () { return cloud.transport ? cloud.transport.pull() : null; },
        doc: docForCloud,
        receive: onRemote,
        transport: function () { return cloud.transport; }
      },
      config: function () { return cloud.config; },
      setConfig: function (c) { cloud.config = c; saveConfig(c); },
      ui: ui,
      openSettings: openSettings,
      render: render,
      reset: function () { store = E.seed(); ensureIdentity(); saveNow(); render(); }
    };
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
